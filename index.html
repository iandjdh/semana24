<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Registro Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card bg-dark text-light border-secondary p-4">
        <h2 id="nombreEstudiante">TU NOMBRE COMPLETO</h2>
        <p id="notaPromedio" class="fw-bold fs-5">Promedio Anual: 0.0 Pts.</p>
        
        <input type="number" id="notaTrimestre1" class="form-control mb-2" placeholder="Nota 1.er Trimestre" min="0" max="100">
        <input type="number" id="notaTrimestre2" class="form-control mb-2" placeholder="Nota 2.do Trimestre" min="0" max="100">
        <input type="number" id="notaTrimestre3" class="form-control mb-3" placeholder="Nota 3.er Trimestre" min="0" max="100">
        
        <button type="button" id="btnCalcular" class="btn btn-success w-100 fw-bold">Calcular Nota Final</button>
    </div>

    <script src="scrip.js"></script>
</body>
</html>
